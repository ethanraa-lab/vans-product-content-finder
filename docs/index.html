<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vans Product Content Finder</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f5f2; color: #181818; font-family: system-ui, sans-serif; }
    header { padding: 1rem max(1.25rem, calc((100vw - 64rem) / 2)); background: #181818; color: #fff; font-weight: 650; }
    main { max-width: 64rem; margin: clamp(3rem, 10vw, 8rem) auto; padding: 0 1.25rem; }
    h1 { border-top: .3rem solid #bd1723; padding-top: 1.5rem; font-size: clamp(2rem, 7vw, 4rem); line-height: 1.05; margin-bottom: 1rem; }
    p { max-width: 55ch; line-height: 1.6; }
  </style>
</head>
<body>
  <header>Product Content Finder</header>
  <main>
    <h1>Vans Product Content Finder</h1>
    <p>Look up product descriptions, features, and materials by Vans style code.</p>
    <p>Product lookup is in development.</p>
  </main>
</body>
</html>
